name: Build KGN APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter create --project-name kgn_tava_fry --platforms android .
      - name: Force minSdk 24 for TTS
        run: |
          echo "--- BEFORE ---"
          grep -rn "minSdk" android/app/ || true
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' android/app/build.gradle.kts || true
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts || true
          echo "--- AFTER ---"
          grep -rn "minSdk" android/app/ || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
